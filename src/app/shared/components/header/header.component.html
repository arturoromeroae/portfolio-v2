<header class="header" [class.scrolled]="scrolled()">
  <div class="container header__inner">

    <a class="header__logo" (click)="scrollTo('hero')" aria-label="Arturo Romero">
      <span class="logo-mark">AR</span>
      <span class="logo-text">
        <span class="logo-name">Arturo Romero</span>
        <span class="logo-role">Senior Full Stack</span>
      </span>
    </a>

    <nav class="header__nav" [class.open]="menuOpen()">
      @for (item of navItems; track item.fragment) {
        <button class="nav-link" (click)="scrollTo(item.fragment)">
          {{ item.labelKey | translate }}
        </button>
      }
      <div class="header__nav-controls">
        <app-theme-switcher />
        <app-language-switcher />
      </div>
    </nav>

    <div class="header__actions">
      <app-theme-switcher class="desktop-only" />
      <app-language-switcher class="desktop-only" />
      <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-label]="'Toggle menu'" [class.active]="menuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
</header>
