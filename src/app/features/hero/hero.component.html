<section class="hero dot-grid" [class.visible]="visible()">
  <!-- Ambient glow -->
  <div class="hero__glow hero__glow--1"></div>
  <div class="hero__glow hero__glow--2"></div>

  <div class="container hero__container">

    <!-- Left: Content -->
    <div class="hero__content">

      <!-- Available badge -->
      <div class="hero__badge">
        <span class="badge-dot"></span>
        {{ 'hero.available' | translate }}
      </div>

      <!-- Greeting -->
      <p class="hero__greeting">{{ 'hero.greeting' | translate }}</p>

      <!-- Name -->
      <h1 class="hero__name">
        Arturo<br>
        <span class="gradient-text">Romero</span>
      </h1>

      <!-- Typewriter role -->
      <div class="hero__role">
        <span class="typewriter">{{ typedText() }}</span><span class="cursor">|</span>
      </div>

      <!-- Tagline -->
      <p class="hero__tagline">{{ 'hero.tagline' | translate }}</p>

      <!-- Location -->
      <div class="hero__location">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Lima, Perú
      </div>

      <!-- CTAs -->
      <div class="hero__ctas">
        <button class="btn btn-primary btn-lg" (click)="scrollToContact()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 12.17 19.79 19.79 0 01.07 3.5 2 2 0 012.06 1.36h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 9.27a16 16 0 006.72 6.72l1.08-1.28a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
          </svg>
          {{ 'hero.cta_contact' | translate }}
        </button>
        <a class="btn btn-secondary btn-lg" href="assets/cv/Arturo-Romero-CV.pdf" download>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          {{ 'hero.cta_cv' | translate }}
        </a>
      </div>

      <!-- Social links -->
      <div class="hero__social">
        <a href="https://www.linkedin.com/in/arturo-romero-b01b641a7" target="_blank" rel="noopener" class="social-link" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          LinkedIn
        </a>
        <a href="https://github.com/arturoromeroae" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/>
          </svg>
          GitHub
        </a>
      </div>

    </div>

    <!-- Right: Avatar & stats -->
    <div class="hero__visual">

      <!-- Avatar -->
      <div class="hero__avatar-wrapper">
        <div class="avatar-ring"></div>
        <div class="avatar-ring avatar-ring--2"></div>
        <div class="hero__avatar">
          <img src="assets/images/yo.jpg" alt="Arturo Romero" />
        </div>
        <!-- Status -->
        <div class="avatar-status">
          <span class="status-dot"></span>
          Available
        </div>
      </div>

      <!-- Stats -->
      <div class="hero__stats">
        <div class="stat-card">
          <span class="stat-number">5+</span>
          <span class="stat-label">Years exp.</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">20+</span>
          <span class="stat-label">Projects</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">4</span>
          <span class="stat-label">Companies</span>
        </div>
      </div>

      <!-- Tech stack pills -->
      <div class="hero__stack">
        @for (tech of techStack; track tech) {
          <span class="tech-badge">{{ tech }}</span>
        }
      </div>

    </div>

  </div>

  <!-- Scroll indicator -->
  <button class="hero__scroll" (click)="scrollDown()" aria-label="Scroll down">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
  </button>

</section>
